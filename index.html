<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio Streamer - Manual</title>
  <style>
    body { font-family: Arial; max-width: 700px; margin: 20px auto; padding: 20px; background: #1a1a2e; color: white; }
    button { padding: 12px 25px; margin: 5px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; }
    #btnEmisor { background: #e94560; color: white; }
    #btnReceptor { background: #0f3460; color: white; }
    #btnDetener { background: #533483; color: white; }
    textarea { width: 100%; height: 100px; background: #16213e; color: #0f0; border: 1px solid #333; border-radius: 8px; padding: 8px; font-size: 12px; resize: vertical; }
    #log { background: #16213e; padding: 15px; border-radius: 10px; max-height: 300px; overflow-y: auto; font-size: 13px; white-space: pre-wrap; margin-top: 15px; }
    .flex { display: flex; gap: 10px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <h1>🎧 Audio Streamer (Manual)</h1>
  <div class="flex">
    <button id="btnEmisor">📱 Emisor (Móvil)</button>
    <button id="btnReceptor">💻 Receptor (PC)</button>
    <button id="btnDetener">⏹️ Detener</button>
  </div>
  <div>
    <h4>📤 Oferta (copiar desde emisor):</h4>
    <textarea id="offerText" placeholder="Esperando oferta..."></textarea>
    <button id="btnPegarOferta">📥 Pegar oferta en receptor</button>
  </div>
  <div>
    <h4>📥 Respuesta (copiar desde receptor):</h4>
    <textarea id="answerText" placeholder="Esperando respuesta..."></textarea>
    <button id="btnPegarRespuesta">📤 Pegar respuesta en emisor</button>
  </div>
  <h3>📋 Log</h3>
  <div id="log"></div>

  <script>
    let pc = null;
    let localStream = null;
    let rol = null; // 'emisor' o 'receptor'

    const log = (msg) => {
      const el = document.getElementById('log');
      el.textContent += `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      el.scrollTop = el.scrollHeight;
    };

    const iceConfig = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]
    };

    function createPeerConnection(esEmisor) {
      if (pc) { pc.close(); pc = null; }
      pc = new RTCPeerConnection(iceConfig);

      if (esEmisor) {
        navigator.mediaDevices.getUserMedia({ audio: true })
          .then(stream => {
            localStream = stream;
            stream.getTracks().forEach(track => pc.addTrack(track, stream));
            log('🎤 Audio capturado');
          })
          .catch(err => log('❌ Error al capturar audio: ' + err.message));
      } else {
        const audio = new Audio();
        pc.ontrack = (event) => {
          audio.srcObject = event.streams[0];
          audio.play();
          log('🔊 Reproduciendo audio en PC');
        };
      }

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          log(`🧊 Candidato ICE: ${event.candidate.candidate.substring(0, 50)}...`);
        }
      };

      pc.oniceconnectionstatechange = () => {
        log(`🔄 Estado ICE: ${pc.iceConnectionState}`);
        if (pc.iceConnectionState === 'connected') {
          log('✅ ¡Conexión establecida!');
        }
      };

      return pc;
    }

    // --- Emisor: Crear oferta y mostrarla ---
    async function iniciarEmisor() {
      if (rol === 'emisor') return;
      rol = 'emisor';
      log('📱 Modo Emisor (Móvil)');
      pc = createPeerConnection(true);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      document.getElementById('offerText').value = JSON.stringify(offer);
      log('📤 Oferta generada (cópiala y pégala en el PC)');
    }

    // --- Receptor: Pegar oferta y generar respuesta ---
    async function pegarOferta() {
      if (rol === 'receptor') return;
      rol = 'receptor';
      log('💻 Modo Receptor (PC)');
      const offerText = document.getElementById('offerText').value;
      if (!offerText) { log('❌ No hay oferta para pegar'); return; }
      try {
        const offer = JSON.parse(offerText);
        pc = createPeerConnection(false);
        await pc.setRemoteDescription(offer);
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        document.getElementById('answerText').value = JSON.stringify(answer);
        log('📤 Respuesta generada (cópiala y pégala en el móvil)');
      } catch (err) {
        log('❌ Error al procesar oferta: ' + err.message);
      }
    }

    // --- Emisor: Pegar respuesta para completar conexión ---
    async function pegarRespuesta() {
      if (rol !== 'emisor') { log('❌ Debes estar en modo Emisor'); return; }
      const answerText = document.getElementById('answerText').value;
      if (!answerText) { log('❌ No hay respuesta para pegar'); return; }
      try {
        const answer = JSON.parse(answerText);
        await pc.setRemoteDescription(answer);
        log('✅ Conexión completada');
      } catch (err) {
        log('❌ Error al procesar respuesta: ' + err.message);
      }
    }

    function detenerTransmision() {
      if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
      if (pc) { pc.close(); pc = null; }
      rol = null;
      document.getElementById('offerText').value = '';
      document.getElementById('answerText').value = '';
      log('⏹️ Transmisión detenida');
    }

    document.getElementById('btnEmisor').onclick = iniciarEmisor;
    document.getElementById('btnReceptor').onclick = () => { log('💻 Modo Receptor listo. Pega la oferta manualmente.'); };
    document.getElementById('btnPegarOferta').onclick = pegarOferta;
    document.getElementById('btnPegarRespuesta').onclick = pegarRespuesta;
    document.getElementById('btnDetener').onclick = detenerTransmision;

    log('🚀 App iniciada. Modo manual (sin servidores externos)');
  </script>
</body>
</html>
